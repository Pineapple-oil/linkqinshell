[workspace]
resolver = "2"
members = [
  "crates/app",
  "crates/core",
  "crates/ui-bridge",
  "crates/storage",
  "crates/security",
  "crates/ssh-client",
  "crates/sftp-client",
  "crates/terminal-engine",
]

[workspace.package]
edition = "2021"
license = "Proprietary"
repository = "https://github.com/linkqin/linkqinshell"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "6"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = "1.16.1"
slint-build = "1.16.1"
ssh2 = "0.9"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
